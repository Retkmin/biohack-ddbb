name: sam-production

services:
  identity-postgres:
    image: postgres:15.12-alpine
    profiles: [production, operations]
    environment:
      POSTGRES_USER: ${IDENTITY_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB:?required}
    volumes: [identity_postgres_data:/var/lib/postgresql/data]
    networks: [identity]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$IDENTITY_POSTGRES_USER -d $$IDENTITY_POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  domain-postgres:
    image: postgres:15.12-alpine
    profiles: [production, operations]
    environment:
      POSTGRES_USER: ${DOMAIN_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${DOMAIN_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${DOMAIN_POSTGRES_DB:?required}
    volumes: [domain_postgres_data:/var/lib/postgresql/data]
    networks: [domain]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$DOMAIN_POSTGRES_USER -d $$DOMAIN_POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  redis:
    image: redis:7.4.2-alpine
    profiles: [production, operations]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: [CMD, "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    image: "${BACKEND_IMAGE_REPOSITORY:?required}@sha256:${BACKEND_IMAGE_DIGEST:?required}"
    profiles: [production]
    environment: &app-environment
      ENVIRONMENT: ${ENVIRONMENT:?required}
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:?required}
      DOMAIN_DATABASE_URL: ${DOMAIN_DATABASE_URL:?required}
      IDENTITY_DATABASE_RUNTIME_ROLE: ${IDENTITY_DATABASE_RUNTIME_ROLE:?required}
      DOMAIN_DATABASE_RUNTIME_ROLE: ${DOMAIN_DATABASE_RUNTIME_ROLE:?required}
      SECRET_KEY: ${SECRET_KEY:?required}
      JWT_SECRET_PROVENANCE_VERSION: ${JWT_SECRET_PROVENANCE_VERSION:?required}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:?required}
      JWT_SECRET_RECEIPT_FILE: ${JWT_SECRET_RECEIPT_FILE:?required}
      JWT_SECRET_REPOSITORY_ROOT: ${JWT_SECRET_REPOSITORY_ROOT:?required}
      REDIS_URL: ${REDIS_URL:?required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?required}
      AI_PROVIDER: ${AI_PROVIDER:?required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?required}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:?required}
      AI_INTAKE_ENABLED: ${AI_INTAKE_ENABLED:?required}
    networks: [internal, identity, domain]
    depends_on:
      identity-postgres: {condition: service_healthy}
      domain-postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  worker:
    image: "${BACKEND_IMAGE_REPOSITORY:?required}@sha256:${BACKEND_IMAGE_DIGEST:?required}"
    profiles: [production]
    command: ["celery", "-A", "app.infrastructure.celery_worker:celery_app", "worker", "--loglevel=INFO"]
    environment: *app-environment
    networks: [internal, identity, domain]
    depends_on:
      identity-postgres: {condition: service_healthy}
      domain-postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  beat:
    image: "${BACKEND_IMAGE_REPOSITORY:?required}@sha256:${BACKEND_IMAGE_DIGEST:?required}"
    profiles: [production]
    command: ["celery", "-A", "app.infrastructure.celery_worker:celery_app", "beat", "--loglevel=INFO"]
    environment: *app-environment
    networks: [internal, identity, domain]
    depends_on:
      identity-postgres: {condition: service_healthy}
      domain-postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  caddy:
    image: "${FRONTEND_IMAGE_REPOSITORY:?required}@sha256:${FRONTEND_IMAGE_DIGEST:?required}"
    profiles: [production]
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data, caddy_config:/config]
    networks: [public, internal]
    depends_on:
      api: {condition: service_healthy}
  migration:
    image: "${BACKEND_IMAGE_REPOSITORY:?required}@sha256:${BACKEND_IMAGE_DIGEST:?required}"
    profiles: [operations]
    command: ["sh", "-c", "alembic -n identity upgrade head && alembic -n domain upgrade head"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?required}
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:?required}
      DOMAIN_DATABASE_URL: ${DOMAIN_DATABASE_URL:?required}
    networks: [identity, domain]
    depends_on:
      identity-postgres: {condition: service_healthy}
      domain-postgres: {condition: service_healthy}
  store-operation:
    image: "${BACKEND_IMAGE_REPOSITORY:?required}@sha256:${BACKEND_IMAGE_DIGEST:?required}"
    profiles: [operations]
    user: "1001:1001"
    entrypoint: ["python", "-m", "app.infrastructure.migration.operation"]
    environment:
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:?required}
      DOMAIN_DATABASE_URL: ${DOMAIN_DATABASE_URL:?required}
      DEPLOYMENT_PLAN_PATH: ${DEPLOYMENT_PLAN_PATH:-/run/sam-plan/plan.json}
      OPERATION_RECEIPT_PATH: ${OPERATION_RECEIPT_PATH:-/var/lib/sam/receipts/preflight.json}
      HEALTH_EVIDENCE_PATH: ${HEALTH_EVIDENCE_PATH:-/var/lib/sam/receipts/health.attestation.json}
    volumes:
      - type: bind
        source: ./plan.json
        target: /run/sam-plan/plan.json
        read_only: true
      - type: bind
        source: ${OPERATION_RECEIPTS_DIR:-/var/lib/sam/receipts}
        target: /var/lib/sam/receipts
    networks: [identity, domain]
    depends_on:
      identity-postgres: {condition: service_healthy}
      domain-postgres: {condition: service_healthy}
  backup-identity:
    image: postgres:15.12-alpine
    profiles: [backup]
    environment:
      PGPASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?required}
    command: ["pg_dump", "-h", "identity-postgres", "-U", "${IDENTITY_POSTGRES_USER:?required}", "-d", "${IDENTITY_POSTGRES_DB:?required}", "-f", "/backups/identity.dump"]
    volumes: [identity_backups:/backups]
    networks: [identity]
    depends_on: {identity-postgres: {condition: service_healthy}}
  backup-domain:
    image: postgres:15.12-alpine
    profiles: [backup]
    environment:
      PGPASSWORD: ${DOMAIN_POSTGRES_PASSWORD:?required}
    command: ["pg_dump", "-h", "domain-postgres", "-U", "${DOMAIN_POSTGRES_USER:?required}", "-d", "${DOMAIN_POSTGRES_DB:?required}", "-f", "/backups/domain.dump"]
    volumes: [domain_backups:/backups]
    networks: [domain]
    depends_on: {domain-postgres: {condition: service_healthy}}
  restore-identity:
    image: postgres:15.12-alpine
    profiles: [backup]
    environment:
      PGPASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?required}
    command: ["pg_restore", "-h", "identity-postgres", "-U", "${IDENTITY_POSTGRES_USER:?required}", "-d", "${IDENTITY_POSTGRES_DB:?required}", "--clean", "--if-exists", "/backups/identity.dump"]
    volumes: [identity_backups:/backups]
    networks: [identity]
    depends_on: {identity-postgres: {condition: service_healthy}}
  restore-domain:
    image: postgres:15.12-alpine
    profiles: [backup]
    environment:
      PGPASSWORD: ${DOMAIN_POSTGRES_PASSWORD:?required}
    command: ["pg_restore", "-h", "domain-postgres", "-U", "${DOMAIN_POSTGRES_USER:?required}", "-d", "${DOMAIN_POSTGRES_DB:?required}", "--clean", "--if-exists", "/backups/domain.dump"]
    volumes: [domain_backups:/backups]
    networks: [domain]
    depends_on: {domain-postgres: {condition: service_healthy}}

networks:
  public:
  internal: {internal: true}
  identity: {internal: true}
  domain: {internal: true}

volumes:
  redis_data:
  caddy_data:
  caddy_config:
  identity_postgres_data:
  domain_postgres_data:
  identity_backups:
  domain_backups:
