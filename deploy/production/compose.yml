name: sam-production

services:
  # Legacy combined store: retained read-only through the cutover/rollback
  # window. The application still routes here until a later phase switches to
  # the two isolated stores below; this copy is never deleted until the
  # restore drill passes.
  postgres:
    image: postgres:15.12-alpine
    profiles: [production, operations]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  identity-postgres:
    image: postgres:15.12-alpine
    profiles: [production, operations]
    environment:
      POSTGRES_USER: ${IDENTITY_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB:?required}
    volumes: [identity_postgres_data:/var/lib/postgresql/data]
    networks: [identity]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$IDENTITY_POSTGRES_USER -d $$IDENTITY_POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  domain-postgres:
    image: postgres:15.12-alpine
    profiles: [production, operations]
    environment:
      POSTGRES_USER: ${DOMAIN_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${DOMAIN_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${DOMAIN_POSTGRES_DB:?required}
    volumes: [domain_postgres_data:/var/lib/postgresql/data]
    networks: [domain]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$DOMAIN_POSTGRES_USER -d $$DOMAIN_POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    profiles: [production, operations]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: [CMD, "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: {context: ../../../biohack-back}
    profiles: [production]
    environment: &app-environment
      ENVIRONMENT: ${ENVIRONMENT:?required}
      DATABASE_URL: ${DATABASE_URL:?required}
      DATABASE_RUNTIME_ROLE: ${DATABASE_RUNTIME_ROLE:?required}
      SECRET_KEY: ${SECRET_KEY:?required}
      JWT_SECRET_PROVENANCE_VERSION: ${JWT_SECRET_PROVENANCE_VERSION:?required}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:?required}
      JWT_SECRET_RECEIPT_FILE: ${JWT_SECRET_RECEIPT_FILE:?required}
      JWT_SECRET_REPOSITORY_ROOT: ${JWT_SECRET_REPOSITORY_ROOT:?required}
      REDIS_URL: ${REDIS_URL:?required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?required}
      AI_PROVIDER: ${AI_PROVIDER:?required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?required}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:?required}
      AI_INTAKE_ENABLED: ${AI_INTAKE_ENABLED:?required}
    networks: [internal]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build: {context: ../../../biohack-back}
    profiles: [production]
    command: ["celery", "-A", "app.infrastructure.celery_worker:celery_app", "worker", "--loglevel=INFO"]
    environment: *app-environment
    networks: [internal]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build: {context: ../../../biohack-back}
    profiles: [production]
    command: ["celery", "-A", "app.infrastructure.celery_worker:celery_app", "beat", "--loglevel=INFO"]
    environment: *app-environment
    networks: [internal]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  caddy:
    build:
      context: ../../../biohack-front
      args: {VITE_API_URL: /api}
    profiles: [production]
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data, caddy_config:/config]
    networks: [public, internal]
    depends_on:
      api: {condition: service_healthy}

  migration:
    build: {context: ../../../biohack-back}
    profiles: [operations]
    command: ["alembic", "upgrade", "f7a8b9c0d1e2"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?required}
      DATABASE_URL: ${DATABASE_URL:?required}
    networks: [internal]
    depends_on:
      postgres: {condition: service_healthy}

  provisioning:
    build: {context: ../../../biohack-back}
    profiles: [operations]
    command: ["python", "-m", "app.ops.provision_runtime_login"]
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?required}
      DATABASE_LOGIN_PASSWORD: ${DATABASE_LOGIN_PASSWORD:?required}
    networks: [internal]
    depends_on:
      postgres: {condition: service_healthy}

  migration-verification:
    build: {context: ../../../biohack-back}
    profiles: [operations]
    command: ["python", "-m", "app.ops.verify_migration_deployment"]
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?required}
      DATABASE_LOGIN_PASSWORD: ${DATABASE_LOGIN_PASSWORD:?required}
      MIGRATION_DEPLOYMENT_TARGET_KIND: ${MIGRATION_DEPLOYMENT_TARGET_KIND:?required}
      MIGRATION_DEPLOYMENT_RECEIPT_PATH: ${MIGRATION_DEPLOYMENT_RECEIPT_PATH:?required}
    volumes:
      - type: bind
        source: ${MIGRATION_DEPLOYMENT_RECEIPTS_DIR:?required}
        target: /var/lib/sam/migration-verification-receipts
    networks: [internal]
    depends_on:
      postgres: {condition: service_healthy}

  # Credential-free store operation adapter. The biohack-ddbb ``ops/*``
  # wrappers invoke this service with a non-secret action + store; the database
  # credentials below come only from the protected VPS environment source.
  store-operation:
    build: {context: ../../../biohack-back}
    profiles: [operations]
    entrypoint: ["python", "-m", "app.infrastructure.migration.operation"]
    environment:
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:?required}
      DOMAIN_DATABASE_URL: ${DOMAIN_DATABASE_URL:?required}
    networks: [identity, domain]
    depends_on:
      identity-postgres: {condition: service_healthy}
      domain-postgres: {condition: service_healthy}

  backup-identity:
    image: postgres:15.12-alpine
    profiles: [backup]
    environment:
      PGPASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?required}
    command: ["pg_dump", "-h", "identity-postgres", "-U", "${IDENTITY_POSTGRES_USER:?required}", "-d", "${IDENTITY_POSTGRES_DB:?required}", "-f", "/backups/identity.dump"]
    volumes: [identity_backups:/backups]
    networks: [identity]
    depends_on:
      identity-postgres: {condition: service_healthy}

  backup-domain:
    image: postgres:15.12-alpine
    profiles: [backup]
    environment:
      PGPASSWORD: ${DOMAIN_POSTGRES_PASSWORD:?required}
    command: ["pg_dump", "-h", "domain-postgres", "-U", "${DOMAIN_POSTGRES_USER:?required}", "-d", "${DOMAIN_POSTGRES_DB:?required}", "-f", "/backups/domain.dump"]
    volumes: [domain_backups:/backups]
    networks: [domain]
    depends_on:
      domain-postgres: {condition: service_healthy}

  restore-identity:
    image: postgres:15.12-alpine
    profiles: [backup]
    environment:
      PGPASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?required}
    command: ["pg_restore", "-h", "identity-postgres", "-U", "${IDENTITY_POSTGRES_USER:?required}", "-d", "${IDENTITY_POSTGRES_DB:?required}", "--clean", "--if-exists", "/backups/identity.dump"]
    volumes: [identity_backups:/backups]
    networks: [identity]
    depends_on:
      identity-postgres: {condition: service_healthy}

  restore-domain:
    image: postgres:15.12-alpine
    profiles: [backup]
    environment:
      PGPASSWORD: ${DOMAIN_POSTGRES_PASSWORD:?required}
    command: ["pg_restore", "-h", "domain-postgres", "-U", "${DOMAIN_POSTGRES_USER:?required}", "-d", "${DOMAIN_POSTGRES_DB:?required}", "--clean", "--if-exists", "/backups/domain.dump"]
    volumes: [domain_backups:/backups]
    networks: [domain]
    depends_on:
      domain-postgres: {condition: service_healthy}

networks:
  public:
  internal: {internal: true}
  identity: {internal: true}
  domain: {internal: true}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  identity_postgres_data:
  domain_postgres_data:
  identity_backups:
  domain_backups:
